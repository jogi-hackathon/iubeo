# Google Go Style Guide (https://google.github.io/styleguide/go/)
# の Style Decisions / Best Practices のうち、バグや設計に効くものだけを選んでいる。
# doc コメントの書き方や名前の長さなど、機械で白黒つけにくい読みやすさの話はレビューに任せる。
version: "2"

linters:
  # errcheck / govet / ineffassign / staticcheck / unused
  default: standard
  enable:
    # 長い関数での naked return 禁止 (Named result parameters)
    - nakedret
    # ポインタと値のレシーバーを混ぜない (Receiver type)
    - recvcheck
    # context を struct に持たせない (Contexts)
    - containedctx
    # エラーは == や型アサーションでなく errors.Is / errors.As で調べる、%w で包む (Error handling)
    - errorlint
    # テスト用ヘルパーは t.Helper() を呼ぶ (Test helpers)
    - thelper
    # testify などのアサーションライブラリを使わない (Assertion libraries)
    - depguard
    - revive

  settings:
    staticcheck:
      checks:
        - all
        # パッケージ・exported 識別子の doc コメントの形式はレビューに任せる (Doc comments)
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        # 命名は revive の var-naming で見る(重複して報告されるのを避ける)
        - -ST1003

    errcheck:
      # `_ = f()` で明示的に捨てるのは許す。黙って捨てるのだけ禁止 (Handle errors)
      check-blank: false

    depguard:
      rules:
        tests:
          files:
            - $test
          deny:
            - pkg: github.com/stretchr/testify
              desc: "testing パッケージと cmp を使う (Assertion libraries)"

    revive:
      # 下に書いたルールだけを使う
      enable-default-rules: false
      rules:
        # ctx は最初の引数 (Contexts)
        - name: context-as-argument
        # error は最後の戻り値 (Returning errors)
        - name: error-return
        # エラー処理を先に書いて正常系をインデントしない (Indent error flow)
        - name: indent-error-flow
        # dot import 禁止 (Import dot)
        - name: dot-imports
        # blank import は main とテストだけ (Import blank)
        - name: blank-imports
        # 意味のない import の別名を付けない (Import renaming)
        - name: redundant-import-alias
        # 名前に _ を使わない・頭字語は大文字をそろえる (Underscores / Initialisms)
        - name: var-naming
        # util / common / helper のような中身のわからない名前のパッケージを作らない (Package names)
        - name: package-naming

  exclusions:
    # oapi-codegen の生成物 (internal/api/api.gen.go) は見ない
    generated: lax

formatters:
  enable:
    # gofmt 準拠と、標準ライブラリを分けた import のまとまり (Formatting / Import grouping)
    - gofmt
    - goimports
  exclusions:
    generated: lax
