version: "2"

linters:
  default: standard
  enable:
    - nakedret
    - recvcheck
    - containedctx
    - errorlint
    - thelper
    - depguard
    - revive

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1003

    errcheck:
      check-blank: false

    depguard:
      rules:
        tests:
          files:
            - $test
          deny:
            - pkg: github.com/stretchr/testify
              desc: "testing パッケージと cmp を使う (Assertion libraries)"

    revive:
      enable-default-rules: false
      rules:
        - name: context-as-argument
        - name: error-return
        - name: indent-error-flow
        - name: dot-imports
        - name: blank-imports
        - name: redundant-import-alias
        - name: var-naming
        - name: package-naming

  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
