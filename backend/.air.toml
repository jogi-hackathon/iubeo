# air(Go のホットリロード)の設定。devenv の processes.backend から backend/ で起動する
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go"]
exclude_dir = ["tmp", "api"]
exclude_regex = ["_test\\.go$"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
