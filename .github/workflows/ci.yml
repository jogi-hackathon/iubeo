name: ci

on:
  pull_request:
  # deploy-*.yml から呼ばれる。main へデプロイする前に必ずここを通し、
  # CI が赤ならデプロイしない
  workflow_call:

# 検証だけなので AWS の資格情報は要らない
permissions:
  contents: read

concurrency:
  # PR は新しい push で古い実行を止める。
  # main 側は止めずに待たせる(デプロイ側の run から呼ばれるため途中で切らない)
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更されたパスを見て、走らせるジョブを決める。
  # 関係の無いジョブは skip する(課金分と待ち時間が減る)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 差分を取るため全履歴が要る
          fetch-depth: 0
      - id: detect
        name: 変更されたパスを判定
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-changes.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 整形・ビルド・テスト
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
          go build ./...
          go vet ./...
          go test ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 依存をインストール
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # pnpm build は先頭で型検査(typecheck)を走らせるので、ここでは改めて呼ばない
      - name: 型検査・lint・テスト・ビルド
        working-directory: frontend
        run: |
          pnpm lint
          pnpm test
          pnpm build

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - name: 整形と検証
        working-directory: infra/aws/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
