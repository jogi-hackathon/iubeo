name: deploy-cloudflare

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "wisp/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 直近に成功したデプロイのコミットを取得
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh run list --workflow deploy-cloudflare.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          echo "直近の成功: ${sha:-(なし)}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: バックエンドの変更有無を判定
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ steps.last.outputs.sha }}
          SHA: ${{ github.sha }}
        run: |
          backend=true
          if [ "$EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$SHA" -- backend .github/workflows/deploy-cloudflare.yml; then
              backend=false
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "バックエンドを再デプロイ: $backend"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 依存をインストール
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # バックエンドを先にデプロイする。サービスバインディングは
      # 相手の Worker が存在しないと解決できないため
      - name: バックエンド Worker をデプロイ
        if: steps.changes.outputs.backend == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy --mode backend

      # WISP(実サイトへ出るプロキシ)は backend の次、フロントの前にデプロイする。
      # フロントがサービスバインディングで参照するため。トークンの検証鍵(WISP_KEY)は
      # 既に Worker に保存されているので secrets file は要らない
      - name: WISP Worker をデプロイ
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy --mode wisp

      - name: フロント Worker をデプロイ
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IUBEO_WISP_ENABLED: "1"
          VITE_ENGINE_BASE_URL: ${{ vars.VITE_ENGINE_BASE_URL }}
          VITE_ENABLE_DEBUG: ${{ vars.VITE_ENABLE_DEBUG }}
        run: pnpm deploy
