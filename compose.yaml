# 開発用の compose。Nix(devenv)も手動インストールも使わずに、バックエンドとフロントをまとめて起動する。
#
#   docker compose up           # 起動 (http://localhost:5173/?debug)
#   docker compose down         # 停止
#   docker compose exec frontend pnpm engine:setup   # PC の Web 検索画面を使う場合 (Gecko エンジン)
#
# 依存 (node_modules と Go のキャッシュ) はコンテナ内の名前付きボリュームに入るので、ホスト側は汚さない。
# ソースはホストから bind マウントするので、編集はそのまま反映される (Go は `docker compose restart backend` が要る)。
# バックエンドの設定は devenv.nix と同じ開発用の既定値。変えたいときは environment を書き換える。
name: iubeo

services:
  backend:
    image: golang:1.27-alpine
    working_dir: /src
    command: go run ./cmd/server
    environment:
      GOTOOLCHAIN: local
      IUBEO_ADDR: ":8080"
      IUBEO_SIGNING_KEY: iubeo-dev-only-signing-key-do-not-use-in-prod
      IUBEO_ALLOWED_ORIGINS: http://localhost:5173
      IUBEO_MATCH_SIZE: "3"
      IUBEO_PHASE_COUNT: "3"
      IUBEO_PHASE_DURATION: 1m
      IUBEO_INTERMISSION_DURATION: 15s
      IUBEO_BYPASS_DURATION: 30s
      IUBEO_FIRE_DURATION: 10s
      IUBEO_CPU_FILL_AFTER: 30s
      # リポジトリルートの .env があればそこから、無ければ空 (未設定なら検索は Yahoo! JAPAN へ 302)
      IUBEO_BRAVE_API_KEY: ${IUBEO_BRAVE_API_KEY:-}
    ports:
      # フロントは compose のネットワーク経由で backend:8080 を見る。ここは手元から curl したいとき用
      - "8080:8080"
    volumes:
      - ./backend:/src
      - backend-mod:/go/pkg/mod
      - backend-build:/root/.cache/go-build
    init: true

  frontend:
    image: node:24
    working_dir: /app
    # pnpm 11 (CI と同じ) を入れて依存を揃えてから、Vite を 0.0.0.0 で起動する
    command: >-
      sh -c "npm install --global pnpm@11 &&
             pnpm install --frozen-lockfile &&
             exec pnpm dev --host 0.0.0.0"
    environment:
      IUBEO_BACKEND_URL: http://backend:8080
      # WISP はコンテナ内の 127.0.0.1:5001 に立つ。ブラウザからは Vite の /wisp プロキシ経由で使う
      VITE_WISP_URL: ws://localhost:5173/wisp
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # ホストの node_modules を混ぜない (macOS と Linux でバイナリが違う)
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend-mod:
  backend-build:
  frontend-node-modules:
